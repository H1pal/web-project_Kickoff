<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick-Off</title>
    <link rel="icon" href="../images/electric_kickboard.png">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/report.css">
    <link rel="stylesheet" href="../css/log_inup.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
</head>
<body>
    <main>
      <section id="logform_section">
        <div id="report_title">
          <h2><span class="span_pm">PM</span> 회원가입</h2>
          <p class="form_notice"><span class="span_pm">PM</span>의 안전한 세상을 가꾸어 볼까요?</p>
        </div>
        <div id="logform_box">
          <form action="" id="logform">
            <div id="logform_info">
              <input type="text" name="user_id" id="user_id" placeholder="아이디">
              <input type="text" name="user_password" id="user_password" placeholder="비밀번호">
            </div>
            <div id="bt-login_box">
              <button type="submit" id="bt-login">로그인</button>
            </div>
          </form>

          <div id="login_help-sign">
            <ul>
              <li><span class="span_help-sign">회원가입</span><a href="./log_up.html"></a></li>
              <li><span class="span_help-sign">아이디 찾기</span></li>
              <li><span class="span_help-sign">비밀번호 찾기</span></li>
            </ul>
          </div>
        </div>

        <div id="logform_logo">
          <a href="../html/main.html">
            <img src="../images/kickoff.png" alt="logo">
          </a>
        </div>

      </section>
    </main>
</body>
</html>
